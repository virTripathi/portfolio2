# Render Blueprint — deploy the NestJS API from the monorepo root.
# https://render.com/docs/blueprint-spec
#
# IMPORTANT: Root Directory must be the repo root (`.`), NOT `apps/api`.

services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=@portfolio/types && npm run build --workspace=@portfolio/api
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_TO
        sync: false
      - key: CONTACT_FROM
        sync: false
      - key: GITHUB_TOKEN
        sync: false
